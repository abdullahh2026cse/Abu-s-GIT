<html>
<head>
<style> form{
	text-align: center;
	background-color: orange;
	color: white;
	border: 2px solid black;
	margin: 20px auto;
	padding: 10px;
	width: 300px;}
</style>
</head> 



<body>
<h1 style="text-align: center;"> Simple HTML Form </h1>
<form>


<label>Username:</label>
<input type="text" name="username" >
<br>
<br>


<label >password:</label>
<input type="password" pass="password">
<br>
<br>


<label>contact no:</label>
<input type="number" contact="contact no">
<br>
<br>


<label>Email id:</label>
<input type="email" email="Email id" >
<br>
<br>



<label style="text-align: center;">Gender:</label>

<input type="radio" name="gender" value="male">Male

<input type="radio" name="gender" value="female">Female
<br><br>

<label>Skills:</label>
<input type="checkbox" name="skill" value="html">HTML
<input type="checkbox" name="skill" value="css">CSS
<input type="checkbox" name="skill" value="javascript">Javascript

<br><br>
<input type="submit" value="submit" >
<input type="reset" value="reset" >
 
</form>


</body>
</html>
