<!DOCTYPE html>
<html>
    <body>
        <h2>Largest Number</h2>
        <script>
            function largest(a, b) {
                if (a > b) {
                    return a;
                } else {
                    return b;
                }
            }
            let result = largest(15, 25);
            document.write("The largest number =" + result);
        </script>    
    </body>
</html>
